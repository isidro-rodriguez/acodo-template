# Hooks de pre-commit.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: Ruff check --fix (lint con autocorrección)
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]

      - id: ty-check
        name: Ty (tipado estático)
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: Pytest (tests)
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
