[project]
name = "acodo-template"
version = "0.3.0"
description = "Plantilla Python de la librería Acodo"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "acodo",
]

[project.scripts]
main = "acodo_template.main:main"

[dependency-groups]
dev = [
  "pre-commit>=4.7.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.1",
  "ty>=0.0.89",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.14.0"]
build-backend = "uv_build"

# --- pytest y covertura ------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_also = ["pragma: no cover", "if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "--doctest-modules"]
testpaths = ["tests"]

# --- Astral Ruff -------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PERF", "PTH", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["acodo_template"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# --- Astral ty ---------------------------------------------------------------
[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]

[tool.uv.build-backend]
module-name = "acodo_template"

# --- Otros -------------------------------------------------------------------
