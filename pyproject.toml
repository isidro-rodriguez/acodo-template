[project]
name = "python-boilerplate"
dynamic = ["version"]
description = "Boilerplate moderno para proyectos de Python"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Tu Nombre", email = "tu@email.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[dependency-groups]
dev = [
    "pdoc>=16.0.0",
    "pytest>=8.0.0",
    "pre-commit>=4.0.0",
    "ruff>=0.3.0",
    "ty>=0.0.84",
]

[project.optional-dependencies]

[project.scripts]
main = "python_boilerplate.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/python_boilerplate/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.rules]
possibly-unresolved-reference = "error"
