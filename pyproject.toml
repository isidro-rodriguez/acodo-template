[project]
name = "pyplate"
dynamic = ["version"]
description = "Plantilla minimalista para proyectos Python"
readme = "README.md"
requires-python = ">=3.13"
# authors = [{ name = "Tu Nombre", email = "tu@correo.com" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]


# =============================================================================
#  Dependencias
# =============================================================================


dependencies = [
    "irg-utils",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "pyjwt[crypto]>=2.15.1",
    "pytest>=8.0.0",
    "rich>=15.0.0",
    "ruff>=0.17.1",
    "ty>=0.0.88",
    "typer>=0.27.3",
]

[tool.uv.sources]
irg-utils = { git = "https://github.com/isidro-rodriguez/irg-utils" }


# =============================================================================
#  Configuración básica
# =============================================================================


[project.scripts]
pyplate = "pyplate.main:main"

[tool.hatch.version]
path = "src/pyplate/__init__.py"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"


# =============================================================================
#  Astral Ruff
# =============================================================================


[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "SIM", "PTH", "RUF", "C4"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]


# =============================================================================
#  Astral ty
# =============================================================================


[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.rules]
possibly-unresolved-reference = "error"


# =============================================================================
#  PyTest
# =============================================================================


[tool.pytest.ini_options]
testpaths = ["tests"]


# =============================================================================
#  Otros
# =============================================================================
